<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Clean Crisp White Tile for High Visibility on Dark & Light Browser Tabs -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" stroke="#CBD5E1" stroke-width="3" />
  
  <!-- 5-Pointed Star at Top-Right Gap (Vibrant Teal) -->
  <polygon points="74,10 77,22 89,22 79,30 83,41 74,34 65,41 69,30 59,22 71,22" fill="#0D9488" />
  
  <!-- Outer 'P' Upper Arch (Deep Navy) -->
  <path d="M 23,48 C 23,25 39,14 59,14 C 64,14 70,15 74,17" stroke="#0C3B6E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Outer 'P' Lower Loop (Deep Navy) -->
  <path d="M 78,28 C 83,36 83,48 78,57 C 71,67 60,72 47,72" stroke="#0C3B6E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Left Outer Vertical Stem of P (Deep Navy) -->
  <path d="M 23,48 L 23,90" stroke="#0C3B6E" stroke-width="9" stroke-linecap="round" />
  
  <!-- 1. Left Diagonal Arrow (Deep Navy) -->
  <path d="M 25,58 L 39,44" stroke="#0C3B6E" stroke-width="7.5" stroke-linecap="round" />
  <polygon points="34,35 50,40 44,53" fill="#0C3B6E" />
  
  <!-- 2. Middle Main Soaring Arrow (Deep Navy) -->
  <path d="M 26,88 C 26,73 31,60 47,44 L 54,37" stroke="#0C3B6E" stroke-width="8" stroke-linecap="round" />
  <polygon points="48,27 67,34 59,49" fill="#0C3B6E" />
  
  <!-- 3. Right Inner Curved Arrow (Vibrant Teal) -->
  <path d="M 38,88 C 38,76 42,68 52,58" stroke="#0D9488" stroke-width="7.5" stroke-linecap="round" />
  <polygon points="47,49 63,54 57,67" fill="#0D9488" />
</svg>
