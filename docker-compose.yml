version: '3.8'

services:
  shine-peerpath:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shine-peerpath-app
    restart: always
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
